services:
  - type: web
    name: cineverse-backend
    env: docker
    rootDir: cineverse-backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: APP_JWT_SECRET
        value: "cineverse-super-secret-key-change-in-production-min-256-bits-long!!"
