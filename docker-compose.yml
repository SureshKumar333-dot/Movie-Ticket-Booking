version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cineverse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-122004}
      MYSQL_DATABASE: cineverse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./cineverse-backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${SPRING_DATASOURCE_PASSWORD:-122004}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cineverse-network

  backend:
    build:
      context: ./cineverse-backend
      dockerfile: Dockerfile
    container_name: cineverse-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cineverse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-122004}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cineverse-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cineverse-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cineverse-network

volumes:
  mysql_data:

networks:
  cineverse-network:
    driver: bridge
